name: Validate Skill Pack

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.0.2
      - run: python scripts/validate_tri_channel_pack.py
      - name: Validate pinned tri-channel tool manifests
        run: |
          python scripts/validate_public_tool_manifests.py \
            --provenance contracts/manifests/provenance.json \
            --manifest meta=contracts/manifests/meta.json \
            --manifest google=contracts/manifests/google.json \
            --manifest tiktok=contracts/manifests/tiktok.json
      - run: python -m pytest -q
