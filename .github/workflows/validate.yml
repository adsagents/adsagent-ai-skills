name: Validate Skill Pack

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.0.2
      - name: Check generated Claude plugin directory
        run: python scripts/sync_claude_plugin_tree.py --check
      - run: python scripts/validate_tri_channel_pack.py
      - name: Check release manifest tag is published
        run: python scripts/validate_release_manifest_tag.py
      - name: Validate tool references and deprecated-tool list
        run: python scripts/validate_public_tool_manifests.py
      - name: Check hosted Registry manifest consistency
        run: python scripts/validate_registry_manifests.py
      - run: python -m pytest -q
      - name: Drift check (warnings never block; exit 1 blocks in block-removed mode)
        env:
          ADSAGENT_DRIFT_SOURCE_META: ${{ vars.ADSAGENT_DRIFT_SOURCE_META }}
          ADSAGENT_DRIFT_SOURCE_GOOGLE: ${{ vars.ADSAGENT_DRIFT_SOURCE_GOOGLE }}
          ADSAGENT_DRIFT_SOURCE_TIKTOK: ${{ vars.ADSAGENT_DRIFT_SOURCE_TIKTOK }}
        run: |
          set +e
          python scripts/check_drift.py
          code=$?
          if [ "$code" -eq 10 ]; then
            echo "::warning::Skills differ from the services' published tool manifests; see the report above."
            code=0
          elif [ "$code" -eq 2 ]; then
            echo "::warning::A tool manifest source could not be read; drift was not checked."
            code=0
          fi
          exit "$code"
